$kind: http-request
url: "{{base_url}}/menu/customer/{{table_id}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const customerMenuData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('is a non-empty array with category_name and description', () => {
        pm.expect(customerMenuData.length).to.be.above(0);
        pm.expect(customerMenuData[0]).to.have.property('category_name');
        pm.expect(customerMenuData[0]).to.have.property('description');
      });
      pm.collectionVariables.set('customer_menu_category_id', customerMenuData[0].category);
    language: text/javascript
order: 8000
