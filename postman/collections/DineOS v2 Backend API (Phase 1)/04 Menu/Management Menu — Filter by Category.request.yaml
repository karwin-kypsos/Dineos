$kind: http-request
url: "{{base_url}}/menu/all/?category={{category_id}}"
method: GET
headers:
  Authorization: Bearer {{manager_token}}
scripts:
  - type: afterResponse
    code: |-
      const filterByCategoryData = pm.response.json();
      const results = filterByCategoryData.results || filterByCategoryData;
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every item belongs to the requested category', () => {
          results.forEach(item => pm.expect(item.category).to.eql(Number(pm.collectionVariables.get('category_id'))));
      });
    language: text/javascript
order: 9050
