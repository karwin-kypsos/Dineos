$kind: http-request
url: "{{base_url}}/menu/customer/{{table_id}}/?category={{customer_menu_category_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const filteredMenuData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every item belongs to the requested category', () => {
        filteredMenuData.forEach(item => pm.expect(String(item.category)).to.eql(String(pm.collectionVariables.get('customer_menu_category_id'))));
      });
    language: text/javascript
order: 8050
