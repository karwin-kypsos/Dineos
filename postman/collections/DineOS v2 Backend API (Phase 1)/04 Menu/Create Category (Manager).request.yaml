$kind: http-request
url: "{{base_url}}/menu/categories/"
method: POST
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Starters {{$timestamp}}", "emoji": "🥗", "sort_order": 2}'
scripts:
  - type: afterResponse
    code: |-
      const createCategoryData = pm.response.json();
      pm.collectionVariables.set('category_id', createCategoryData.id);
    language: text/javascript
order: 1000
