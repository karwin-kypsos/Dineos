$kind: http-request
url: "{{base_url}}/menu/{{temp_menu_item_id}}/"
method: PATCH
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"sort_order": 3}'
scripts:
  - type: afterResponse
    code: |-
      const patchSortOrderData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('sort_order updated', () => pm.expect(patchSortOrderData.sort_order).to.eql(3));
    language: text/javascript
order: 5500
