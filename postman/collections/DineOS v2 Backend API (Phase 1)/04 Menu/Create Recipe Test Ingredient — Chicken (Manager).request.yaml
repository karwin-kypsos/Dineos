$kind: http-request
url: "{{base_url}}/inventory/ingredients/"
method: POST
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Chicken Recipe Test {{$timestamp}}", "unit": "KG"}'
scripts:
  - type: afterResponse
    code: |-
      const createChickenData = pm.response.json();
      pm.collectionVariables.set('recipe_test_chicken_id', createChickenData.id);
      pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 3090
