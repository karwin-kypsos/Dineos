$kind: http-request
url: "{{base_url}}/menu/categories/{{category_id}}/"
method: DELETE
headers:
  Authorization: Bearer {{manager_token}}
scripts:
  - type: afterResponse
    code: pm.test('status is 409 (category still has menu items)', () => pm.response.to.have.status(409));
    language: text/javascript
order: 14000
