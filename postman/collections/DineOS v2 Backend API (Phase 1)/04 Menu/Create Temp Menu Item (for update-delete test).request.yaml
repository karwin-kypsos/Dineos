$kind: http-request
name: Create Temp Menu Item (for update/delete test)
url: "{{base_url}}/menu/"
method: POST
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"category": {{category_id}}, "name": "Temp Dish", "price": "50.00"}'
scripts:
  - type: afterResponse
    code: |-
      const createTempItemData = pm.response.json();
      pm.collectionVariables.set('temp_menu_item_id', createTempItemData.id);
      pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 4000
