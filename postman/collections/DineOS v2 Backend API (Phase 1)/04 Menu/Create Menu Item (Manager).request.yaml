$kind: http-request
url: "{{base_url}}/menu/"
method: POST
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"category": {{category_id}}, "name": "Paneer Tikka", "price": "180.00", "description": "Grilled paneer"}'
scripts:
  - type: afterResponse
    code: |-
      const createMenuItemData = pm.response.json();
      pm.collectionVariables.set('menu_item_id', createMenuItemData.id);
    language: text/javascript
order: 3000
