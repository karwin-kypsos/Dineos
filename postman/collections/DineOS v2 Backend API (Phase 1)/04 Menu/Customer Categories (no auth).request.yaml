$kind: http-request
url: "{{base_url}}/menu/categories/customer/{{table_id}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const customerCategoriesData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('is a non-empty array with id/name/sort_order, no auth-only fields', () => {
        pm.expect(customerCategoriesData.length).to.be.above(0);
        const c = customerCategoriesData[0];
        pm.expect(c).to.have.property('id');
        pm.expect(c).to.have.property('name');
        pm.expect(c).to.have.property('sort_order');
        pm.expect(c).to.not.have.property('branch');
        pm.expect(c).to.not.have.property('item_count');
      });
    language: text/javascript
order: 8060
