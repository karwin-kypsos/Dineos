$kind: http-request
url: "{{base_url}}/menu/{{temp_menu_item_id}}/"
method: PUT
headers:
  Authorization: Bearer {{manager_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"category": {{category_id}}, "name": "Temp Dish (Updated)", "price": "60.00"}'
scripts:
  - type: afterResponse
    code: |-
      const updateTempItemData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('name updated', () => pm.expect(updateTempItemData.name).to.eql('Temp Dish (Updated)'));
    language: text/javascript
order: 5000
