$kind: http-request
url: "{{base_url}}/orders/takeaway/?status=all"
method: GET
headers:
  Authorization: Bearer {{branch_cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const listTakeawayData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('includes the just-placed takeaway order', () => {
        pm.expect(listTakeawayData.some(o => o.id === pm.collectionVariables.get('takeaway_order_id'))).to.be.true;
      });
      pm.test('every result has total_amount', () => {
        listTakeawayData.forEach(o => pm.expect(o.total_amount).to.exist);
      });
    language: text/javascript
order: 20500
