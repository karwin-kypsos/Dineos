$kind: http-request
url: "{{base_url}}/orders/takeaway/{{takeaway_round_2_id}}/details/"
method: GET
headers:
  Authorization: Bearer {{branch_cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const detailsViaRoundData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('resolves back to round 1 as the root order_id', () => pm.expect(detailsViaRoundData.order_id).to.eql(pm.collectionVariables.get('takeaway_order_id')));
      pm.test('still has both rounds', () => pm.expect(detailsViaRoundData.rounds.length).to.eql(2));
    language: text/javascript
order: 20580
