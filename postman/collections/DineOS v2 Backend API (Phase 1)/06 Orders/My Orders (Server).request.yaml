$kind: http-request
url: "{{base_url}}/orders/mine/"
method: GET
headers:
  Authorization: Bearer {{server_token}}
scripts:
  - type: afterResponse
    code: |-
      const myOrdersData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('response is a list', () => pm.expect(myOrdersData).to.be.an('array'));
      pm.test('every returned order is dine-in', () => pm.expect(myOrdersData.every((o) => o.order_type === 'DINE_IN')).to.be.true);
      pm.test('every order has a raw table_number', () => pm.expect(myOrdersData.every((o) => !!o.table_number)).to.be.true);
    language: text/javascript
order: 13500
