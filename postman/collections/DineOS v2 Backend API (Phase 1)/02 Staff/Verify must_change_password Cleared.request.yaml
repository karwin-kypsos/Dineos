$kind: http-request
url: "{{base_url}}/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "{{invited_staff_email}}", "password": "Demo@1234"}'
scripts:
  - type: afterResponse
    code: |-
      const clearedLoginData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('must_change_password is now false', () => pm.expect(clearedLoginData.must_change_password).to.eql(false));
    language: text/javascript
order: 2320
