$kind: http-request
url: "{{base_url}}/auth/change-password/"
method: PATCH
headers:
  Authorization: Bearer {{invited_staff_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"current_password": "{{staff_temp_password}}", "new_password": "Demo@1234"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2310
