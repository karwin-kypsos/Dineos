$kind: http-request
url: "{{base_url}}/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "{{invited_staff_email}}", "password": "{{staff_temp_password}}"}'
scripts:
  - type: afterResponse
    code: |-
      const staffTempLoginData = pm.response.json();
      pm.collectionVariables.set('invited_staff_token', staffTempLoginData.access);
      pm.test('status is 200 (login succeeds immediately with the temp password)', () => pm.response.to.have.status(200));
      pm.test('must_change_password is true', () => pm.expect(staffTempLoginData.must_change_password).to.eql(true));
    language: text/javascript
order: 2300
