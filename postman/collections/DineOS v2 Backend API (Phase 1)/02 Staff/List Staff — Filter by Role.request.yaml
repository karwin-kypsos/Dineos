$kind: http-request
url: "{{base_url}}/staff/?role=MANAGER"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const filterRoleData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every result has role MANAGER', () => {
        filterRoleData.results.forEach(u => pm.expect(u.role).to.eql('MANAGER'));
      });
    language: text/javascript
order: 2460
