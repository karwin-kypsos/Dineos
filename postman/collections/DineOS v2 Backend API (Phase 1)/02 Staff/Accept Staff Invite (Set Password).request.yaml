$kind: http-request
url: "{{base_url}}/auth/reset-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"token": "{{invite_token}}", "new_password": "Demo@1234"}'
scripts:
  - type: afterResponse
    code: |-
      const acceptStaffInviteData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('role is SERVER', () => pm.expect(acceptStaffInviteData.role).to.eql('SERVER'));
    language: text/javascript
order: 2300
