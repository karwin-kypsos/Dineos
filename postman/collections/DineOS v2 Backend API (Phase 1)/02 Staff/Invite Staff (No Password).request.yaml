$kind: http-request
url: "{{base_url}}/staff/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"email": "invited-server-{{$timestamp}}@{{tenant_slug}}.demo", "role": "SERVER", "name": "Invited Server"}'
scripts:
  - type: afterResponse
    code: |-
      const inviteStaffData = pm.response.json();
      pm.collectionVariables.set('invite_token', inviteStaffData.invite_token);
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.test('must_change_password is true', () => pm.expect(inviteStaffData.must_change_password).to.eql(true));
    language: text/javascript
order: 2200
