$kind: http-request
url: "{{base_url}}/staff/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"email": "invited-server-{{$timestamp}}@{{tenant_slug}}.demo", "role": "SERVER", "name": "Invited Server"}'
scripts:
  - type: afterResponse
    code: |-
      const inviteStaffData = pm.response.json();
      pm.collectionVariables.set('staff_temp_password', inviteStaffData.temp_password);
      pm.collectionVariables.set('invited_staff_email', inviteStaffData.email);
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.test('temp_password is returned (backend-generated, not Admin-typed)', () => pm.expect(inviteStaffData.temp_password).to.be.a('string'));
      pm.test('no invite_token (staff no longer uses the token/email-link flow)', () => pm.expect(inviteStaffData.invite_token).to.be.undefined);
      pm.test('must_change_password is true', () => pm.expect(inviteStaffData.must_change_password).to.eql(true));
    language: text/javascript
order: 2200
