$kind: http-request
url: "{{base_url}}/branches/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Temp Branch {{$timestamp}}", "address": "To be deactivated"}'
scripts:
  - type: afterResponse
    code: |-
      const createTempBranchData = pm.response.json();
      pm.collectionVariables.set('temp_branch_id', createTempBranchData.id);
    language: text/javascript
examples: .resources/Create Temp Branch (for deactivate test).resources/examples
order: 3000
