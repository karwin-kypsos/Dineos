$kind: http-request
url: "{{base_url}}/branches/?status=inactive"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const filterInactiveData = pm.response.json();
      const results = Array.isArray(filterInactiveData) ? filterInactiveData : filterInactiveData.results;
      const ids = results.map(b => b.id);
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('all returned branches are inactive', () => results.every(b => b.is_active === false));
      pm.test('includes the deactivated branch', () => pm.expect(ids).to.include(pm.collectionVariables.get('temp_branch_id')));
    language: text/javascript
order: 4600
