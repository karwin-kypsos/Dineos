$kind: http-request
url: "{{base_url}}/branches/{{temp_branch_2_id}}/?permanent=true&confirm=true"
method: DELETE
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const confirmData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('detail confirms permanent deletion', () => pm.expect(confirmData.detail).to.include('permanently deleted'));
    language: text/javascript
order: 4870
