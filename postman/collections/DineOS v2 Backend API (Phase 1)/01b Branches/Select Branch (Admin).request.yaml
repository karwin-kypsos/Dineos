$kind: http-request
url: "{{base_url}}/auth/select-branch/"
method: PATCH
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"branch_id": "{{branch_id}}"}'
scripts:
  - type: afterResponse
    code: |-
      const selectBranchData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('branch reflects the selection', () => pm.expect(selectBranchData.branch.id).to.eql(pm.collectionVariables.get('branch_id')));
    language: text/javascript
order: 2150
