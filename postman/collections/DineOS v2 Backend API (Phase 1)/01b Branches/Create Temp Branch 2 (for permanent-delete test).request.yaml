$kind: http-request
url: "{{base_url}}/branches/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Temp Branch {{$timestamp}}", "address": "To be permanently deleted"}'
scripts:
  - type: afterResponse
    code: |-
      const createTempBranch2Data = pm.response.json();
      pm.collectionVariables.set('temp_branch_2_id', createTempBranch2Data.id);
      pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 4850
