$kind: http-request
url: "{{server_root}}/platform/tenants/{{new_org_id}}/"
method: GET
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const orgDetailData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('returned org matches new_org_id', () => pm.expect(String(orgDetailData.id)).to.eql(String(pm.collectionVariables.get('new_org_id'))));
    language: text/javascript
order: 2010
