$kind: http-request
url: "{{server_root}}/platform/tenants/?status=ACTIVE"
method: GET
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const filterActiveOrgData = pm.response.json();
      const results = Array.isArray(filterActiveOrgData) ? filterActiveOrgData : filterActiveOrgData.results;
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('all returned orgs are ACTIVE', () => results.every(o => o.status === 'ACTIVE'));
    language: text/javascript
order: 2050
