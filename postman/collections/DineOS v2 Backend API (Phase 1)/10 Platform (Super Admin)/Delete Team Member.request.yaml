$kind: http-request
url: "{{server_root}}/platform/team/{{team_member_id}}/"
method: DELETE
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const deleteTeamMemberData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('detail confirms removal', () => pm.expect(deleteTeamMemberData.detail).to.include('removed successfully'));
    language: text/javascript
order: 7200
