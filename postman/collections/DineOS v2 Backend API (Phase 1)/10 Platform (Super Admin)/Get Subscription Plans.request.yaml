$kind: http-request
url: "{{server_root}}/platform/plans/"
method: GET
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const plansData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('includes GROWTH plan', () => pm.expect(plansData.map(p => p.tier)).to.include('GROWTH'));
    language: text/javascript
order: 1600
