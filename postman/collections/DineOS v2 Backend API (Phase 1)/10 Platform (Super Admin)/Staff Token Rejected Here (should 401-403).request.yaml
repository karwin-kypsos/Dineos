$kind: http-request
name: Staff Token Rejected Here (should 401/403)
url: "{{server_root}}/platform/tenants/"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: pm.test('status is 401 (restaurant staff token rejected on platform routes)', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
