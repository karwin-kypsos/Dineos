$kind: http-request
url: "{{server_root}}/platform/tenants/{{new_org_id}}/status/"
method: PATCH
headers:
  Authorization: Bearer {{platform_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"status": "ACTIVE"}'
scripts:
  - type: afterResponse
    code: |-
      const reactivateOrgData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('org status is ACTIVE', () => pm.expect(reactivateOrgData.status).to.eql('ACTIVE'));
    language: text/javascript
order: 2160
