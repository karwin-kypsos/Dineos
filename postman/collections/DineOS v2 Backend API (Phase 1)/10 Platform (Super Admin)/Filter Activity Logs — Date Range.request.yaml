$kind: http-request
url: "{{server_root}}/platform/activity/?date_from=2026-08-06&date_to=2026-08-06"
method: GET
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const dateFilterData = pm.response.json();
      const results = Array.isArray(dateFilterData) ? dateFilterData : dateFilterData.results;
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every entry is within the date range', () => {
        results.forEach(a => {
          const day = a.created_at.slice(0, 10);
          pm.expect(day).to.eql('2026-08-06');
        });
      });
    language: text/javascript
order: 5150
