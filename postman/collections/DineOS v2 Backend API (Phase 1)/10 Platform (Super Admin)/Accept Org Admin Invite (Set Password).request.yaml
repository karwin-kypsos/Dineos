$kind: http-request
url: "{{base_url}}/auth/reset-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"token": "{{new_org_admin_invite_token}}", "new_password": "Demo@1234"}'
scripts:
  - type: afterResponse
    code: |-
      const acceptOrgInviteData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('role is ADMIN', () => pm.expect(acceptOrgInviteData.role).to.eql('ADMIN'));
    language: text/javascript
order: 1900
