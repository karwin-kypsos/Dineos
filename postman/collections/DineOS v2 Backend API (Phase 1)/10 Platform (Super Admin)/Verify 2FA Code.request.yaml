$kind: http-request
name: Platform Login — Step 2 (verify 2FA code)
url: "{{server_root}}/platform/auth/verify-2fa/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "{{platform_admin_email}}", "code": "{{platform_login_code}}"}'
scripts:
  - type: afterResponse
    code: |-
      const verify2faData = pm.response.json();
      pm.collectionVariables.set('platform_token', verify2faData.access);
      pm.collectionVariables.set('platform_refresh_token', verify2faData.refresh);
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('response includes a refresh token', () => pm.expect(verify2faData.refresh).to.exist);
    language: text/javascript
order: 1500
