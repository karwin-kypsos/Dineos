$kind: http-request
url: "{{server_root}}/platform/tenants/"
method: POST
headers:
  Authorization: Bearer {{platform_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Aura Test Bistro {{$timestamp}}",
      "slug": "aura-test-{{$timestamp}}",
      "contact_name": "Test Org Admin",
      "contact_email": "orgadmin-{{$timestamp}}@dineos-test.demo",
      "contact_phone": "9876543210",
      "plan_tier": "GROWTH"
    }
scripts:
  - type: afterResponse
    code: |-
      const createTenantData = pm.response.json();
      pm.collectionVariables.set('new_org_id', createTenantData.id);
      pm.collectionVariables.set('new_org_admin_email', createTenantData.contact_email);
      if (createTenantData.admin_user_id) { pm.collectionVariables.set('new_admin_id', createTenantData.admin_user_id); }
      if (createTenantData.invite_token) { pm.collectionVariables.set('new_org_admin_invite_token', createTenantData.invite_token); }
      pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1800
