$kind: http-request
name: Dashboard
url: "{{server_root}}/platform/dashboard/"
method: GET
headers:
  Authorization: Bearer {{platform_token}}
scripts:
  - type: afterResponse
    code: |-
      const dashboardData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('has monthly_revenue', () => pm.expect(dashboardData).to.have.property('monthly_revenue'));
      pm.test('new_signups_this_week has 7 days', () => pm.expect(dashboardData.new_signups_this_week).to.have.lengthOf(7));
      pm.test('has organizations_needing_attention_count', () => pm.expect(dashboardData.organizations_needing_attention_count).to.be.a('number'));
      pm.test('has total_branches', () => pm.expect(dashboardData.total_branches).to.be.a('number'));
      pm.test('weekly_revenue has 7 days', () => pm.expect(dashboardData.weekly_revenue).to.have.lengthOf(7));
      pm.test('has revenue_vs_last_week', () => pm.expect(dashboardData).to.have.property('revenue_vs_last_week'));
      pm.test('has revenue_vs_last_week_percentage', () => pm.expect(dashboardData).to.have.property('revenue_vs_last_week_percentage'));
      pm.test('recent_activity is a list', () => pm.expect(dashboardData.recent_activity).to.be.an('array'));
    language: text/javascript
order: 4000
