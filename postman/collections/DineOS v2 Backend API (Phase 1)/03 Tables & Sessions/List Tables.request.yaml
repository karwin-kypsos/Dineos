$kind: http-request
url: "{{base_url}}/tables/?page_size=100"
method: GET
headers:
  Authorization: Bearer {{manager_token}}
scripts:
  - type: afterResponse
    code: |-
      const tablesData = pm.response.json();
      const tablesList = tablesData.results || tablesData;
      const match = tablesList.find(t => t.table_number === pm.collectionVariables.get('table_number'));
      if (match) { pm.collectionVariables.set('table_id', match.id); }
      pm.test('each table has assigned_server_id/_name and active_orders', () => {
        tablesList.forEach(t => {
          pm.expect(t).to.have.property('assigned_server_id');
          pm.expect(t).to.have.property('assigned_server_name');
          pm.expect(t.active_orders).to.be.an('array');
        });
      });
    language: text/javascript
order: 1000
