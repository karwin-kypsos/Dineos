$kind: http-request
url: "{{base_url}}/cashier/shifts/{{shift_id}}/close/"
method: POST
headers:
  Authorization: Bearer {{cashier_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"counted_cash": "0.00"}'
scripts:
  - type: afterResponse
    code: pm.test('status is 409 (uncounted cash mismatch)', () => pm.response.to.have.status(409));
    language: text/javascript
order: 7000
