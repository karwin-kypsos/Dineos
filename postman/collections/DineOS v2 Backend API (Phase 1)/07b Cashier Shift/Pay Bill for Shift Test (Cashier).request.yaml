$kind: http-request
url: "{{base_url}}/bills/payment/"
method: POST
headers:
  Authorization: Bearer {{cashier_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"session_id": "{{session_id}}", "payment_method": "CASH"}'
scripts:
  - type: afterResponse
    code: pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 4000
