$kind: http-request
url: "{{base_url}}/tables/{{table_id}}/"
method: GET
headers:
  Authorization: Bearer {{manager_token}}
scripts:
  - type: afterResponse
    code: |-
      const assignedTableData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('table got auto-assigned a server on its first order', () => {
        pm.expect(assignedTableData.assigned_server_id).to.not.be.null;
      });
    language: text/javascript
order: 3050
