$kind: http-request
url: "{{base_url}}/cashier/collections/my-sales/?payment_method=CASH"
method: GET
headers:
  Authorization: Bearer {{cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const filteredData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every returned bill is CASH', () => {
        pm.expect(filteredData.bills.every(b => b.payment_method === 'CASH')).to.be.true;
      });
      pm.test('list is filtered but totals are not (this cashier only paid via CASH today)', () => {
        pm.expect(filteredData.tables_served).to.be.at.least(filteredData.bills.length);
      });
    language: text/javascript
order: 9150
