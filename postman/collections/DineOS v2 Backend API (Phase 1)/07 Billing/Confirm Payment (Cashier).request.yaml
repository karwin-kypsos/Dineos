$kind: http-request
url: "{{base_url}}/bills/payment/"
method: POST
headers:
  Authorization: Bearer {{cashier_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"session_id": "{{session_id}}", "payment_method": "CASH"}'
scripts:
  - type: afterResponse
    code: |-
      const payBillData = pm.response.json();
      pm.collectionVariables.set('bill_id', payBillData.id);
    language: text/javascript
order: 3000
