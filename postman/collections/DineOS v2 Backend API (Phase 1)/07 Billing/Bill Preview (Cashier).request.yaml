$kind: http-request
url: "{{base_url}}/bills/session/{{session_id}}/"
method: GET
headers:
  Authorization: Bearer {{cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const billPreviewData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('preview has items and table_number', () => {
        pm.expect(billPreviewData.items.length).to.be.above(0);
        pm.expect(billPreviewData.table_number).to.exist;
      });
      pm.test('payment_status is BILL_REQUESTED (Request Bill ran first)', () => {
        pm.expect(billPreviewData.payment_status).to.eql('BILL_REQUESTED');
      });
    language: text/javascript
order: 2000
