$kind: http-request
url: "{{base_url}}/bills/{{bill_id}}/"
method: GET
headers:
  Authorization: Bearer {{cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const receiptData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('same bill id comes back', () => pm.expect(receiptData.id).to.eql(pm.collectionVariables.get('bill_id')));
      pm.test('has items, restaurant info, and gst_percentage', () => {
        pm.expect(receiptData.items.length).to.be.above(0);
        pm.expect(receiptData).to.have.property('restaurant_name');
        pm.expect(receiptData.gst_percentage).to.exist;
      });
      pm.test('rounds/rounds_count/items_count present', () => {
        pm.expect(receiptData.rounds_count).to.eql(2);
        pm.expect(receiptData.rounds.length).to.eql(2);
        pm.expect(receiptData.items_count).to.be.above(0);
      });
      pm.test('timeline is chronological and ends with Bill paid', () => {
        const labels = receiptData.timeline.map(e => e.label);
        pm.expect(labels[labels.length - 1]).to.eql('Bill paid');
        pm.expect(labels.some(l => l.includes('Round 1 placed'))).to.be.true;
        pm.expect(labels.some(l => l.includes('Bill requested by customer'))).to.be.true;
      });
    language: text/javascript
order: 3100
