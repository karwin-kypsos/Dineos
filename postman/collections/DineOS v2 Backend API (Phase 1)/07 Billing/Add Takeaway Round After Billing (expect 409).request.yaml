$kind: http-request
url: "{{base_url}}/orders/takeaway/"
method: POST
headers:
  Authorization: Bearer {{branch_cashier_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "existing_order_id": "{{takeaway_order_id}}",
      "items": [{"menu_item": {{menu_item_id}}, "quantity": 1}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 409 - already billed', () => pm.response.to.have.status(409));
    language: text/javascript
order: 20200
