$kind: http-request
url: "{{base_url}}/bills/takeaway/{{takeaway_order_id}}/"
method: GET
headers:
  Authorization: Bearer {{branch_cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const takeawayPreviewData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('preview has a total_amount', () => pm.expect(takeawayPreviewData.total_amount).to.exist);
      pm.test('preview has items', () => pm.expect(takeawayPreviewData.items.length).to.be.above(0));
      pm.test('preview has branch info', () => pm.expect(takeawayPreviewData.restaurant_name).to.exist);
      pm.test('payment_status is PENDING (not paid yet)', () => pm.expect(takeawayPreviewData.payment_status).to.eql('PENDING'));
    language: text/javascript
order: 20000
