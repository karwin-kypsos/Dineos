$kind: http-example
name: 'Change Password - Success'
originalRequest:
  method: PATCH
  url: '{{base_url}}/auth/change-password/'
  headers:
    Content-Type: application/json
  body:
    type: text
    content: '{"current_password": "Demo@1234", "new_password": "Demo@1234"}'
code: 200
body:
  type: text
  content: '{"detail":"Password changed."}'
