$kind: http-request
url: "{{base_url}}/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "cashier@{{tenant_slug}}.demo", "password": "Demo@1234"}'
scripts:
  - type: afterResponse
    code: |-
      const cashierLoginData = pm.response.json();
      pm.collectionVariables.set('cashier_token', cashierLoginData.access);
    language: text/javascript
examples: './.resources/Login — Cashier.resources/examples'
order: 4000
