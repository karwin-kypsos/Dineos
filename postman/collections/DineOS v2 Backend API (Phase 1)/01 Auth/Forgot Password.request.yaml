$kind: http-request
url: "{{base_url}}/auth/forgot-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email": "admin@{{tenant_slug}}.demo"}'
scripts:
  - type: afterResponse
    code: |-
      const forgotPwData = pm.response.json();
      if (forgotPwData.token) { pm.collectionVariables.set('reset_token', forgotPwData.token); }
    language: text/javascript
examples: './.resources/Forgot Password.resources/examples'
order: 8000
