$kind: http-request
url: "{{base_url}}/notifications/"
method: GET
headers:
  Authorization: Bearer {{server_token}}
scripts:
  - type: afterResponse
    code: |-
      const serverNotifsData = pm.response.json();
      const serverNotifsList = serverNotifsData.results || serverNotifsData;
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('server has an ORDER_READY notification for the dine-in order', () => {
        pm.expect(serverNotifsList.some(n => n.type === 'ORDER_READY' && n.order === pm.collectionVariables.get('order_2_id'))).to.be.true;
      });
    language: text/javascript
order: 2050
