$kind: http-request
url: "{{base_url}}/notifications/"
method: GET
headers:
  Authorization: Bearer {{branch_cashier_token}}
scripts:
  - type: afterResponse
    code: |-
      const cashierNotifsData = pm.response.json();
      const cashierNotifsList = cashierNotifsData.results || cashierNotifsData;
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('cashier has an ORDER_READY notification for the takeaway round', () => {
        pm.expect(cashierNotifsList.some(n => n.type === 'ORDER_READY' && n.order === pm.collectionVariables.get('takeaway_round_2_id'))).to.be.true;
      });
    language: text/javascript
order: 2100
