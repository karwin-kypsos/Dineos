$kind: http-request
url: "{{base_url}}/inventory/purchase-orders/?status=PENDING"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const filterStatusData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every result has status PENDING', () => {
        filterStatusData.results.forEach(po => pm.expect(po.status).to.eql('PENDING'));
      });
    language: text/javascript
order: 4050
