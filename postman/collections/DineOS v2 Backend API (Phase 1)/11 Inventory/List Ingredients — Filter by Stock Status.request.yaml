$kind: http-request
url: "{{base_url}}/inventory/ingredients/?stock_status=critical&page_size=200"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const stockStatusData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('includes Paneer (0 stock, never restocked)', () => {
        const ids = stockStatusData.results.map(i => i.id);
        pm.expect(ids).to.include(pm.collectionVariables.get('temp_ingredient_id'));
      });
      pm.test('every result really is critical (0 stock)', () => {
        stockStatusData.results.forEach(i => pm.expect(parseFloat(i.current_stock)).to.be.at.most(0));
      });
    language: text/javascript
order: 3150
