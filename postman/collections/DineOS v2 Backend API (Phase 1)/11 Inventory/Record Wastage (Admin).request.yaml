$kind: http-request
url: "{{base_url}}/inventory/ingredients/{{ingredient_id}}/record-wastage/"
method: PATCH
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"quantity": "2.00", "wastage_reason": "SPOILED", "reason": "Left out overnight"}'
scripts:
  - type: afterResponse
    code: |-
      const recordWastageData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('current_stock decreased', () => pm.expect(recordWastageData.current_stock).to.eql('48.00'));
    language: text/javascript
order: 2500
