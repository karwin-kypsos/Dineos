$kind: http-request
url: "{{base_url}}/inventory/purchase-orders/{{purchase_order_id}}/approve/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const approvePoData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('status is APPROVED', () => pm.expect(approvePoData.status).to.eql('APPROVED'));
    language: text/javascript
order: 4200
