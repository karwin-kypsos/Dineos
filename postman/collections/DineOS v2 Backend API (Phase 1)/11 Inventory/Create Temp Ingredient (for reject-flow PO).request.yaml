$kind: http-request
url: "{{base_url}}/inventory/ingredients/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"name": "Paneer {{$timestamp}}", "unit": "KG", "unit_cost": "320.00", "minimum_stock_level": "5.00", "supplier_name": "Dairy Fresh"}'
scripts:
  - type: afterResponse
    code: |-
      const createTempIngredientData = pm.response.json();
      pm.collectionVariables.set('temp_ingredient_id', createTempIngredientData.id);
      pm.test('status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1100
