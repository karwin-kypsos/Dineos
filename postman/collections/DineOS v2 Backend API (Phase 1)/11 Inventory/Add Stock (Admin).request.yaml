$kind: http-request
url: "{{base_url}}/inventory/ingredients/{{ingredient_id}}/add-stock/"
method: PATCH
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: '{"quantity": "50.00", "unit_cost": "85.00"}'
scripts:
  - type: afterResponse
    code: |-
      const addStockData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('current_stock increased', () => pm.expect(addStockData.current_stock).to.eql('50.00'));
    language: text/javascript
order: 2000
