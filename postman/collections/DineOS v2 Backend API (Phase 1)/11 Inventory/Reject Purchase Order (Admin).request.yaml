$kind: http-request
url: "{{base_url}}/inventory/purchase-orders/{{temp_purchase_order_id}}/reject/"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const rejectPoData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('status is REJECTED', () => pm.expect(rejectPoData.status).to.eql('REJECTED'));
    language: text/javascript
order: 4900
