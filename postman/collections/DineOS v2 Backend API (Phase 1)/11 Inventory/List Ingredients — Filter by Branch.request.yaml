$kind: http-request
url: "{{base_url}}/inventory/ingredients/?branch={{branch_id}}&page_size=200"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const branchFilterData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every result belongs to this exact branch', () => {
        branchFilterData.results.forEach(i => pm.expect(i.branch).to.eql(pm.collectionVariables.get('branch_id')));
      });
    language: text/javascript
order: 3160
