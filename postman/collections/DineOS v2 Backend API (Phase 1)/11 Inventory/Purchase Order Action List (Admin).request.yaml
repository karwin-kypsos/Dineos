$kind: http-request
url: "{{base_url}}/inventory/purchase-orders/?needs_action=true"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const actionListData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('every result needs action (status PENDING)', () => {
        actionListData.results.forEach(po => pm.expect(po.status).to.eql('PENDING'));
      });
    language: text/javascript
order: 4070
