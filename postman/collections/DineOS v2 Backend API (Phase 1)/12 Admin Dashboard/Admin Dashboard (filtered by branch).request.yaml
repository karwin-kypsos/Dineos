$kind: http-request
url: "{{base_url}}/admin/dashboard/?branch={{branch_id}}"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const adminDashboardBranchData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('at least one order counted for this branch (takeaway)', () => pm.expect(adminDashboardBranchData.today_orders_count).to.be.at.least(1));
    language: text/javascript
order: 1100
