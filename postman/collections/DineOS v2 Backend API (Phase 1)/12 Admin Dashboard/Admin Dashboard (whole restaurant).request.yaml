$kind: http-request
url: "{{base_url}}/admin/dashboard/"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const adminDashboardData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('has today_orders_count', () => pm.expect(adminDashboardData.today_orders_count).to.exist);
      pm.test('has total_staff_count', () => pm.expect(adminDashboardData.total_staff_count).to.be.a('number'));
      pm.test('has active/total branches counts', () => {
        pm.expect(adminDashboardData.active_branches_count).to.be.a('number');
        pm.expect(adminDashboardData.total_branches_count).to.be.a('number');
      });
      pm.test('branches is an array', () => pm.expect(adminDashboardData.branches).to.be.an('array'));
      pm.test('recent_notifications is an array', () => pm.expect(adminDashboardData.recent_notifications).to.be.an('array'));
    language: text/javascript
order: 1000
