$kind: http-request
url: "{{base_url}}/admin/ai/low-stock-alerts/"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const lowStockAlertsData = pm.response.json();
      const ids = lowStockAlertsData.map(a => a.ingredient_id);
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('flags the never-restocked Paneer ingredient', () => pm.expect(ids).to.include(pm.collectionVariables.get('temp_ingredient_id')));
    language: text/javascript
order: 3000
