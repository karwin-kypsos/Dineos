$kind: http-request
url: "{{base_url}}/admin/ai/chat/messages/"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const listChatData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('includes the message just sent', () => {
          const found = listChatData.some(m => m.content === 'How was our revenue today, and is anything running low on stock?');
          pm.expect(found).to.eql(true);
      });
    language: text/javascript
order: 3300
