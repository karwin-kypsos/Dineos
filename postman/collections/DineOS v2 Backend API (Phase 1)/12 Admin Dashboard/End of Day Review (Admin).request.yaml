$kind: http-request
url: "{{base_url}}/admin/eod-review/"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const eodReviewData = pm.response.json();
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('has wastage_entries_count', () => pm.expect(eodReviewData.wastage_entries_count).to.exist);
    language: text/javascript
order: 2000
